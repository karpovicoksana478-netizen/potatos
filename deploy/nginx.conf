# /etc/nginx/sites-available/potatos — обратный прокси для potatos
# Замените potatos.example.com на свой домен (или на IP, если домена ещё нет).

upstream potatos_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name potatos.example.com;

    client_max_body_size 400m;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    location /static/ {
        proxy_pass http://potatos_backend;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://potatos_backend;
        add_header X-Content-Type-Options nosniff;
    }

    # WebSocket — эфиры и живой чат
    location /ws {
        proxy_pass http://potatos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://potatos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
